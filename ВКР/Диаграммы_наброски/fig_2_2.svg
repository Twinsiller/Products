<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="Arial, sans-serif" font-size="13">
  <style>
    .lane { fill:#f6f9fb; stroke:#7a99b1; stroke-width:1.2; }
    .laneT { fill:#fff; stroke:#7a99b1; stroke-width:1.2; }
    .ttl { font-weight:bold; font-size:16px; }
    .task { fill:#fff; stroke:#2c5d8c; stroke-width:1.5; rx:18; ry:18; }
    .gw { fill:#fff5d1; stroke:#b08900; stroke-width:1.5; }
    .se { fill:#9bd1a4; stroke:#1f8a40; stroke-width:2; }
    .ee { fill:#f5b7b1; stroke:#c0392b; stroke-width:2; }
    .new { fill:#e7f3ff; stroke:#2c5d8c; stroke-width:1.8; rx:18; ry:18; }
    .ar { stroke:#333; stroke-width:1.5; fill:none; }
    .lbl { fill:#111; }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="550" y="22" text-anchor="middle" class="ttl">BPMN «To-Be»: целевой процесс с интеллектуальным подбором рациона</text>

  <rect class="laneT" x="20" y="50"  width="160" height="120"/>
  <rect class="lane"  x="180" y="50" width="900" height="120"/>
  <text x="100" y="115" text-anchor="middle" font-weight="bold">Пользователь</text>

  <rect class="laneT" x="20" y="170" width="160" height="180"/>
  <rect class="lane"  x="180" y="170" width="900" height="180"/>
  <text x="100" y="265" text-anchor="middle" font-weight="bold">Серверный модуль</text>

  <circle class="se" cx="220" cy="110" r="16"/>
  <text class="lbl" x="220" y="145" text-anchor="middle" font-size="11">Открыть сервис</text>

  <rect class="task" x="280" y="80" width="100" height="60"/>
  <text class="lbl" x="330" y="115" text-anchor="middle">Положить товар</text>

  <rect class="task" x="640" y="80" width="120" height="60"/>
  <text class="lbl" x="700" y="105" text-anchor="middle">Принять</text>
  <text class="lbl" x="700" y="123" text-anchor="middle">подсказки</text>

  <rect class="task" x="800" y="80" width="120" height="60"/>
  <text class="lbl" x="860" y="105" text-anchor="middle">Оформить</text>
  <text class="lbl" x="860" y="123" text-anchor="middle">заказ</text>

  <circle class="ee" cx="980" cy="110" r="16"/>
  <text class="lbl" x="980" y="145" text-anchor="middle" font-size="11">Конец</text>

  <path class="ar" d="M236,110 L280,110" marker-end="url(#m)"/>
  <path class="ar" d="M380,110 L420,110" marker-end="url(#m)"/>
  <path class="ar" d="M580,110 L640,110" marker-end="url(#m)"/>
  <path class="ar" d="M760,110 L800,110" marker-end="url(#m)"/>
  <path class="ar" d="M920,110 L964,110" marker-end="url(#m)"/>

  <polygon class="gw" points="420,110 450,90 480,110 450,130"/>
  <text class="lbl" x="450" y="115" text-anchor="middle" font-size="11">Корзина</text>
  <text class="lbl" x="450" y="80" text-anchor="middle" font-size="11">пуста?</text>

  <rect class="new" x="500" y="80" width="80" height="60"/>
  <text class="lbl" x="540" y="115" text-anchor="middle">да</text>
  <path class="ar" d="M540,140 Q540,180 540,220" marker-end="url(#m)"/>

  <rect class="new" x="220" y="190" width="160" height="60"/>
  <text class="lbl" x="300" y="215" text-anchor="middle">Рассчитать</text>
  <text class="lbl" x="300" y="233" text-anchor="middle">КБЖУ корзины</text>

  <rect class="new" x="420" y="190" width="180" height="60"/>
  <text class="lbl" x="510" y="215" text-anchor="middle">Подобрать блюда</text>
  <text class="lbl" x="510" y="233" text-anchor="middle">по составу корзины</text>

  <rect class="new" x="640" y="190" width="200" height="60"/>
  <text class="lbl" x="740" y="215" text-anchor="middle">Сформировать список</text>
  <text class="lbl" x="740" y="233" text-anchor="middle">недостающих ингредиентов</text>

  <rect class="new" x="870" y="190" width="180" height="60"/>
  <text class="lbl" x="960" y="215" text-anchor="middle">Вернуть подсказки</text>
  <text class="lbl" x="960" y="233" text-anchor="middle">пользователю</text>

  <path class="ar" d="M380,220 L420,220" marker-end="url(#m)"/>
  <path class="ar" d="M600,220 L640,220" marker-end="url(#m)"/>
  <path class="ar" d="M840,220 L870,220" marker-end="url(#m)"/>

  <path class="ar" d="M330,140 Q330,170 300,190" marker-end="url(#m)"/>
  <path class="ar" d="M960,190 Q960,160 700,140" marker-end="url(#m)"/>

  <rect class="new" x="420" y="280" width="380" height="50"/>
  <text class="lbl" x="610" y="312" text-anchor="middle">Гибридный скоринг (Go-эвристика + Python ML, см. п. 3.4)</text>

  <rect x="20" y="370" width="1060" height="100" rx="6" fill="#fff7e0" stroke="#1f8a40"/>
  <text x="40" y="395" font-weight="bold" fill="#1f5a23">Что добавлено к As-Is:</text>
  <text x="40" y="415">• автоматический расчёт КБЖУ корзины при каждом изменении;</text>
  <text x="40" y="433">• автоматический подбор блюд из текущей корзины с указанием недостающих ингредиентов;</text>
  <text x="40" y="451">• формирование персональных рекомендаций товаров через гибридный модуль (Go + Python).</text>
</svg>
