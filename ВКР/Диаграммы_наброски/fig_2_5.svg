<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-weight:bold; font-size:16px; }
    .actor { fill:#fff; stroke:#2c5d8c; stroke-width:1.5; }
    .life { stroke:#2c5d8c; stroke-width:1; stroke-dasharray:4 3; }
    .act { fill:#e7f3ff; stroke:#2c5d8c; stroke-width:1.2; }
    .ar { stroke:#333; stroke-width:1.4; fill:none; }
    .arr { stroke:#1f8a40; stroke-width:1.4; fill:none; stroke-dasharray:5 3; }
    .lbl { fill:#111; }
    .name { font-weight:bold; }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="mg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f8a40"/>
    </marker>
  </defs>

  <text x="550" y="22" text-anchor="middle" class="ttl">Sequence: подбор блюд по корзине (POST /v1/users/:id/meals/from-cart)</text>

  <g>
    <rect class="actor" x="60" y="50" width="140" height="40"/>
    <text class="name lbl" x="130" y="75" text-anchor="middle">Vue 3 SPA</text>
    <line class="life" x1="130" y1="90" x2="130" y2="560"/>
  </g>
  <g>
    <rect class="actor" x="260" y="50" width="160" height="40"/>
    <text class="name lbl" x="340" y="75" text-anchor="middle">Go: Handler</text>
    <line class="life" x1="340" y1="90" x2="340" y2="560"/>
  </g>
  <g>
    <rect class="actor" x="480" y="50" width="180" height="40"/>
    <text class="name lbl" x="570" y="75" text-anchor="middle">Service: DishesFromCart</text>
    <line class="life" x1="570" y1="90" x2="570" y2="560"/>
  </g>
  <g>
    <rect class="actor" x="720" y="50" width="160" height="40"/>
    <text class="name lbl" x="800" y="75" text-anchor="middle">PostgreSQL</text>
    <line class="life" x1="800" y1="90" x2="800" y2="560"/>
  </g>
  <g>
    <rect class="actor" x="920" y="50" width="160" height="40"/>
    <text class="name lbl" x="1000" y="75" text-anchor="middle">MongoDB</text>
    <line class="life" x1="1000" y1="90" x2="1000" y2="560"/>
  </g>

  <rect class="act" x="125" y="110" width="10" height="430"/>
  <rect class="act" x="335" y="130" width="10" height="370"/>
  <rect class="act" x="565" y="160" width="10" height="320"/>

  <path class="ar" d="M135,130 L335,130" marker-end="url(#m)"/>
  <text class="lbl" x="170" y="125">POST /meals/from-cart {items}</text>

  <path class="ar" d="M345,160 L565,160" marker-end="url(#m)"/>
  <text class="lbl" x="380" y="155">DishesFromCart(uid, avail)</text>

  <path class="ar" d="M575,200 L795,200" marker-end="url(#m)"/>
  <text class="lbl" x="600" y="195">SELECT user (gender)</text>
  <path class="arr" d="M795,225 L575,225" marker-end="url(#mg)"/>

  <path class="ar" d="M575,260 L795,260" marker-end="url(#m)"/>
  <text class="lbl" x="600" y="255">SELECT dishes Preload(...)</text>
  <path class="arr" d="M795,285 L575,285" marker-end="url(#mg)"/>

  <path class="ar" d="M575,320 L795,320" marker-end="url(#m)"/>
  <text class="lbl" x="600" y="315">SELECT products WHERE id IN (...)</text>
  <path class="arr" d="M795,345 L575,345" marker-end="url(#mg)"/>

  <rect x="565" y="365" width="200" height="30" fill="#fff7e0" stroke="#b08900"/>
  <text class="lbl" x="665" y="385" text-anchor="middle" font-style="italic">scoreDishByCategories(...)</text>

  <rect x="565" y="410" width="200" height="30" fill="#fff7e0" stroke="#b08900"/>
  <text class="lbl" x="665" y="430" text-anchor="middle" font-style="italic">nutritionScore(kcal, БЖУ, ...)</text>

  <path class="arr" d="M565,470 L345,470" marker-end="url(#mg)"/>
  <text class="lbl" x="380" y="465">[]OrderMealRecommendation</text>

  <path class="arr" d="M335,510 L135,510" marker-end="url(#mg)"/>
  <text class="lbl" x="170" y="505">200 OK + JSON</text>

  <text x="980" y="290" text-anchor="middle" font-style="italic" font-size="11" fill="#999">в этом сценарии Mongo не задействована</text>

  <rect x="40" y="570" width="1040" height="22" fill="#f6f9fb" stroke="#bcd"/>
  <text x="60" y="586" font-style="italic">Сплошные стрелки — синхронные вызовы; пунктирные — ответы. Целевая задержка цикла: до 200 мс.</text>
</svg>
