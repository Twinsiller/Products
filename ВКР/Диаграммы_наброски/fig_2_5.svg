<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" font-family="Arial, sans-serif" font-size="12">
  <style>
    .ttl { font-weight:bold; font-size:17px; }
    .actor { fill:#fff; stroke:#2c5d8c; stroke-width:1.5; }
    .db { fill:#fff5d1; stroke:#b08900; stroke-width:1.5; }
    .life { stroke:#2c5d8c; stroke-width:1; stroke-dasharray:4 3; }
    .act { fill:#e7f3ff; stroke:#2c5d8c; stroke-width:1.2; }
    .ar { stroke:#333; stroke-width:1.4; fill:none; }
    .arr { stroke:#1f8a40; stroke-width:1.4; fill:none; stroke-dasharray:5 3; }
    .lbl { fill:#111; }
    .sm { font-size:11px; fill:#444; }
    .tiny { font-size:10px; fill:#666; }
    .note { fill:#fff7e0; stroke:#b08900; stroke-width:1; }
    .loop { fill:none; stroke:#666; stroke-width:1; stroke-dasharray:6 4; }
    .name { font-weight:bold; }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <marker id="mg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f8a40"/></marker>
  </defs>

  <text x="650" y="22" text-anchor="middle" class="ttl">Sequence: подбор блюд по корзине POST /v1/users/:id/meals/from-cart</text>

  <g>
    <rect class="actor" x="40" y="50" width="140" height="44"/>
    <text class="name lbl" x="110" y="72" text-anchor="middle">Vue 3 SPA</text>
    <text class="tiny" x="110" y="86" text-anchor="middle">OrdersView.vue</text>
    <line class="life" x1="110" y1="94" x2="110" y2="680"/>
  </g>
  <g>
    <rect class="actor" x="220" y="50" width="180" height="44"/>
    <text class="name lbl" x="310" y="72" text-anchor="middle">Go: Handler</text>
    <text class="tiny" x="310" y="86" text-anchor="middle">GetMealsFromCart</text>
    <line class="life" x1="310" y1="94" x2="310" y2="680"/>
  </g>
  <g>
    <rect class="actor" x="440" y="50" width="200" height="44"/>
    <text class="name lbl" x="540" y="72" text-anchor="middle">Service: DishesFromCart</text>
    <text class="tiny" x="540" y="86" text-anchor="middle">meal_from_order.go</text>
    <line class="life" x1="540" y1="94" x2="540" y2="680"/>
  </g>
  <g>
    <rect class="actor" x="680" y="50" width="200" height="44"/>
    <text class="name lbl" x="780" y="72" text-anchor="middle">scoreDishByCategories</text>
    <text class="tiny" x="780" y="86" text-anchor="middle">для каждого блюда</text>
    <line class="life" x1="780" y1="94" x2="780" y2="680"/>
  </g>
  <g>
    <rect class="db" x="920" y="50" width="200" height="44"/>
    <text class="name lbl" x="1020" y="72" text-anchor="middle">PostgreSQL</text>
    <text class="tiny" x="1020" y="86" text-anchor="middle">User, Dish, Product</text>
    <line class="life" x1="1020" y1="94" x2="1020" y2="680"/>
  </g>
  <g>
    <rect class="actor" x="1160" y="50" width="120" height="44"/>
    <text class="name lbl" x="1220" y="72" text-anchor="middle">nutritionScore</text>
    <text class="tiny" x="1220" y="86" text-anchor="middle">формула</text>
    <line class="life" x1="1220" y1="94" x2="1220" y2="680"/>
  </g>

  <rect class="act" x="105" y="110" width="10" height="560"/>
  <rect class="act" x="305" y="125" width="10" height="540"/>
  <rect class="act" x="535" y="160" width="10" height="490"/>

  <path class="ar" d="M115,130 L305,130" marker-end="url(#m)"/>
  <text class="sm" x="125" y="123">POST /meals/from-cart {items:[{product_id,quantity}…]}</text>
  <text class="tiny" x="125" y="143">Auth: Bearer JWT</text>

  <rect x="220" y="155" width="180" height="35" fill="#fff" stroke="#888"/>
  <text class="tiny" x="310" y="172" text-anchor="middle" font-style="italic">проверка claims.user_id ==</text>
  <text class="tiny" x="310" y="185" text-anchor="middle" font-style="italic">path :id (иначе 403)</text>

  <path class="ar" d="M315,210 L535,210" marker-end="url(#m)"/>
  <text class="sm" x="325" y="203">DishesFromCart(uid, avail)</text>
  <text class="tiny" x="325" y="222">avail = map[product_id]→quantity</text>

  <path class="ar" d="M545,255 L1015,255" marker-end="url(#m)"/>
  <text class="tiny" x="555" y="248">SELECT user (gender) WHERE id = uid</text>
  <path class="arr" d="M1015,278 L545,278" marker-end="url(#mg)"/>
  <text class="tiny" x="555" y="271" fill="#1f8a40">User{Gender}</text>

  <rect x="430" y="288" width="220" height="35" fill="#fff" stroke="#888"/>
  <text class="tiny" x="540" y="305" text-anchor="middle" font-style="italic">mealTarget = gender == male</text>
  <text class="tiny" x="540" y="318" text-anchor="middle" font-style="italic">? 833.3 : 666.7 (ккал/приём)</text>

  <path class="ar" d="M545,345 L1015,345" marker-end="url(#m)"/>
  <text class="tiny" x="555" y="338">SELECT dishes .Preload(Products, CategoryRequirements)</text>
  <path class="arr" d="M1015,368 L545,368" marker-end="url(#mg)"/>
  <text class="tiny" x="555" y="361" fill="#1f8a40">[]Dish с составом</text>

  <path class="ar" d="M545,395 L1015,395" marker-end="url(#m)"/>
  <text class="tiny" x="555" y="388">SELECT products WHERE id IN (cart_ids)</text>
  <path class="arr" d="M1015,418 L545,418" marker-end="url(#mg)"/>
  <text class="tiny" x="555" y="411" fill="#1f8a40">[]Product (с КБЖУ)</text>

  <rect class="loop" x="535" y="438" width="700" height="200"/>
  <text class="sm" x="545" y="455" font-style="italic">loop — для каждого блюда d из подгруженного справочника</text>

  <path class="ar" d="M555,485 L775,485" marker-end="url(#m)"/>
  <text class="tiny" x="565" y="478">score(d, avail, mealTarget)</text>

  <rect x="680" y="498" width="220" height="35" fill="#fff" stroke="#888"/>
  <text class="tiny" x="790" y="514" text-anchor="middle" font-style="italic">normalizeIngredientKey()</text>
  <text class="tiny" x="790" y="528" text-anchor="middle" font-style="italic">сопоставление ингредиентов</text>

  <path class="ar" d="M785,548 L1215,548" marker-end="url(#m)"/>
  <text class="tiny" x="795" y="541">nutritionScore(kcal, P, F, C, mealTarget)</text>

  <rect x="1110" y="558" width="170" height="50" fill="#fff7e0" stroke="#b08900"/>
  <text class="tiny" x="1195" y="574" text-anchor="middle" font-style="italic">balance = 1 − Σ|share − target|</text>
  <text class="tiny" x="1195" y="586" text-anchor="middle" font-style="italic">calFit = 1 − |kcal − mt|/mt</text>
  <text class="tiny" x="1195" y="600" text-anchor="middle" font-style="italic">score = 50·balance + 50·calFit</text>

  <path class="arr" d="M1215,620 L785,620" marker-end="url(#mg)"/>
  <text class="tiny" x="795" y="614" fill="#1f8a40">score ∈ [0..100]</text>

  <rect x="170" y="650" width="350" height="32" fill="#fff" stroke="#888"/>
  <text class="tiny" x="345" y="666" text-anchor="middle" font-style="italic">сортировка: MatchRatio → Matched → Makeable → score</text>
  <text class="tiny" x="345" y="678" text-anchor="middle" font-style="italic">limitAndSortMeals(out, limit)</text>

  <path class="arr" d="M535,700 L315,700" marker-end="url(#mg)"/>
  <text class="tiny" x="325" y="694" fill="#1f8a40">[]OrderMealRecommendation</text>

  <path class="arr" d="M305,720 L115,720" marker-end="url(#mg)"/>
  <text class="tiny" x="135" y="714" fill="#1f8a40">200 OK + JSON (блюда + missing ингредиенты)</text>

  <rect x="40" y="700" width="1240" height="0" fill="none"/>
</svg>
