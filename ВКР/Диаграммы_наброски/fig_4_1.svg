<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-weight:bold; font-size:16px; }
    .ax { stroke:#333; stroke-width:1.2; fill:none; }
    .grid { stroke:#ddd; stroke-width:0.6; }
    .lA { stroke:#888; stroke-width:2; fill:none; stroke-dasharray:5 4; }
    .lB { stroke:#2c5d8c; stroke-width:2.2; fill:none; }
    .lC { stroke:#1f8a40; stroke-width:2.6; fill:none; }
    .lA2 { stroke:#888; stroke-width:2; fill:none; stroke-dasharray:5 4; }
    .lB2 { stroke:#d35400; stroke-width:2.2; fill:none; }
    .lC2 { stroke:#c0392b; stroke-width:2.6; fill:none; }
    .pt { fill:#fff; stroke:#333; }
    .lbl { fill:#111; }
    .legend rect { stroke-width:2; }
  </style>
  <text x="450" y="22" text-anchor="middle" class="ttl">Зависимость Precision@K и Recall@K от K для трёх моделей (плейсхолдер, заменить реальными данными)</text>

  <text x="450" y="50" text-anchor="middle" font-style="italic" font-size="12" fill="#666">Слева — Precision@K (выше = лучше), справа — Recall@K (выше = лучше)</text>

  <g transform="translate(60,80)">
    <text x="170" y="0" text-anchor="middle" font-weight="bold">Precision@K</text>

    <line class="ax" x1="40" y1="380" x2="380" y2="380"/>
    <line class="ax" x1="40" y1="20"  x2="40"  y2="380"/>

    <g class="grid">
      <line x1="40" y1="80"  x2="380" y2="80"/>
      <line x1="40" y1="155" x2="380" y2="155"/>
      <line x1="40" y1="230" x2="380" y2="230"/>
      <line x1="40" y1="305" x2="380" y2="305"/>
    </g>

    <text x="30" y="385" text-anchor="end" font-size="11">0.0</text>
    <text x="30" y="310" text-anchor="end" font-size="11">0.1</text>
    <text x="30" y="235" text-anchor="end" font-size="11">0.2</text>
    <text x="30" y="160" text-anchor="end" font-size="11">0.3</text>
    <text x="30" y="85" text-anchor="end" font-size="11">0.4</text>

    <text x="40"  y="397" text-anchor="middle" font-size="11">5</text>
    <text x="160" y="397" text-anchor="middle" font-size="11">10</text>
    <text x="280" y="397" text-anchor="middle" font-size="11">15</text>
    <text x="380" y="397" text-anchor="middle" font-size="11">20</text>
    <text x="200" y="412" text-anchor="middle" font-size="12" fill="#555">K</text>

    <polyline class="lA" points="40,335 160,346 280,355 380,365"/>
    <circle class="pt" cx="40" cy="335" r="3"/><circle class="pt" cx="160" cy="346" r="3"/>
    <circle class="pt" cx="280" cy="355" r="3"/><circle class="pt" cx="380" cy="365" r="3"/>

    <polyline class="lB" points="40,229 160,260 280,287 380,305"/>
    <circle class="pt" cx="40" cy="229" r="3"/><circle class="pt" cx="160" cy="260" r="3"/>
    <circle class="pt" cx="280" cy="287" r="3"/><circle class="pt" cx="380" cy="305" r="3"/>

    <polyline class="lC" points="40,192 160,210 280,238 380,260"/>
    <circle class="pt" cx="40" cy="192" r="3"/><circle class="pt" cx="160" cy="210" r="3"/>
    <circle class="pt" cx="280" cy="238" r="3"/><circle class="pt" cx="380" cy="260" r="3"/>
  </g>

  <g transform="translate(490,80)">
    <text x="170" y="0" text-anchor="middle" font-weight="bold">Recall@K</text>

    <line class="ax" x1="40" y1="380" x2="380" y2="380"/>
    <line class="ax" x1="40" y1="20"  x2="40"  y2="380"/>

    <g class="grid">
      <line x1="40" y1="80"  x2="380" y2="80"/>
      <line x1="40" y1="155" x2="380" y2="155"/>
      <line x1="40" y1="230" x2="380" y2="230"/>
      <line x1="40" y1="305" x2="380" y2="305"/>
    </g>

    <text x="30" y="385" text-anchor="end" font-size="11">0.0</text>
    <text x="30" y="310" text-anchor="end" font-size="11">0.1</text>
    <text x="30" y="235" text-anchor="end" font-size="11">0.2</text>
    <text x="30" y="160" text-anchor="end" font-size="11">0.3</text>
    <text x="30" y="85" text-anchor="end" font-size="11">0.4</text>

    <text x="40"  y="397" text-anchor="middle" font-size="11">5</text>
    <text x="160" y="397" text-anchor="middle" font-size="11">10</text>
    <text x="280" y="397" text-anchor="middle" font-size="11">15</text>
    <text x="380" y="397" text-anchor="middle" font-size="11">20</text>
    <text x="200" y="412" text-anchor="middle" font-size="12" fill="#555">K</text>

    <polyline class="lA2" points="40,365 160,335 280,300 380,265"/>
    <circle class="pt" cx="40" cy="365" r="3"/><circle class="pt" cx="160" cy="335" r="3"/>
    <circle class="pt" cx="280" cy="300" r="3"/><circle class="pt" cx="380" cy="265" r="3"/>

    <polyline class="lB2" points="40,290 160,225 280,165 380,120"/>
    <circle class="pt" cx="40" cy="290" r="3"/><circle class="pt" cx="160" cy="225" r="3"/>
    <circle class="pt" cx="280" cy="165" r="3"/><circle class="pt" cx="380" cy="120" r="3"/>

    <polyline class="lC2" points="40,260 160,180 280,120 380,80"/>
    <circle class="pt" cx="40" cy="260" r="3"/><circle class="pt" cx="160" cy="180" r="3"/>
    <circle class="pt" cx="280" cy="120" r="3"/><circle class="pt" cx="380" cy="80" r="3"/>
  </g>

  <g class="legend" transform="translate(150,490)">
    <rect width="20" height="2" y="6"  fill="#888"/>      <text x="30" y="12">A: контент-ориентированный fallback</text>
    <rect x="280" width="20" height="2" y="6"  fill="#2c5d8c"/><text x="310" y="12">B: TruncatedSVD</text>
    <rect x="480" width="20" height="2" y="6"  fill="#1f8a40"/><text x="510" y="12">C: гибрид (CB + CF + meal + recency)</text>
  </g>
</svg>
