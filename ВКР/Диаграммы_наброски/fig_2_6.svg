<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-weight:bold; font-size:16px; }
    .layer { fill:#fff; stroke:#2c5d8c; stroke-width:1.5; rx:8; ry:8; }
    .name { font-weight:bold; font-size:14px; }
    .lbl { fill:#111; }
    .ar { stroke:#333; stroke-width:1.4; fill:none; }
    .sm { font-size:11px; fill:#555; }
    .ext { fill:#fff5d1; stroke:#b08900; stroke-width:1.5; }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="450" y="22" text-anchor="middle" class="ttl">Компонентная диаграмма серверной части (6 слоёв)</text>

  <rect class="layer" x="100" y="50" width="700" height="60" fill="#dde9f6"/>
  <text class="name lbl" x="450" y="75" text-anchor="middle">API Layer (internal/api/v1/apies.go)</text>
  <text class="sm" x="450" y="95" text-anchor="middle">Gin router, CORS, authMiddleware (JWT), adminOnly</text>

  <rect class="layer" x="100" y="130" width="700" height="60" fill="#e8eef6"/>
  <text class="name lbl" x="450" y="155" text-anchor="middle">Handlers Layer (internal/handlers/)</text>
  <text class="sm" x="450" y="175" text-anchor="middle">auth.go, product.go, category.go, manufacturer.go, dishes.go, order.go, favourite.go, recommendation.go, admin_users.go, product_image.go</text>

  <rect class="layer" x="100" y="210" width="700" height="60" fill="#eaf5e6"/>
  <text class="name lbl" x="450" y="235" text-anchor="middle">Services Layer (internal/services/)</text>
  <text class="sm" x="450" y="255" text-anchor="middle">order_service.go, product_service.go, recommendation_service.go, meal_from_order.go, python_recommender_service.go</text>

  <rect class="layer" x="100" y="290" width="320" height="60" fill="#f3e6f1"/>
  <text class="name lbl" x="260" y="315" text-anchor="middle">Models Layer</text>
  <text class="sm" x="260" y="335" text-anchor="middle">12 GORM-моделей</text>

  <rect class="layer" x="480" y="290" width="320" height="60" fill="#f9efe0"/>
  <text class="name lbl" x="640" y="315" text-anchor="middle">Repository Layer</text>
  <text class="sm" x="640" y="335" text-anchor="middle">product_image.go (Mongo)</text>

  <rect class="layer" x="100" y="370" width="700" height="60" fill="#fbe9e9"/>
  <text class="name lbl" x="450" y="395" text-anchor="middle">Database Layer (internal/database/)</text>
  <text class="sm" x="450" y="415" text-anchor="middle">postgres.go (GORM), mongo.go (mongo-go-driver)</text>

  <ellipse class="ext" cx="220" cy="480" rx="140" ry="30"/>
  <text class="name lbl" x="220" y="478" text-anchor="middle">PostgreSQL</text>
  <text class="sm" x="220" y="496" text-anchor="middle">12 таблиц</text>

  <ellipse class="ext" cx="450" cy="480" rx="120" ry="30"/>
  <text class="name lbl" x="450" y="478" text-anchor="middle">MongoDB</text>
  <text class="sm" x="450" y="496" text-anchor="middle">products (изобр.)</text>

  <ellipse class="ext" cx="680" cy="480" rx="140" ry="30"/>
  <text class="name lbl" x="680" y="478" text-anchor="middle">Python ML (CLI)</text>
  <text class="sm" x="680" y="496" text-anchor="middle">exec.Command</text>

  <path class="ar" d="M450,110 L450,130" marker-end="url(#m)"/>
  <path class="ar" d="M450,190 L450,210" marker-end="url(#m)"/>
  <path class="ar" d="M260,270 L260,290" marker-end="url(#m)"/>
  <path class="ar" d="M640,270 L640,290" marker-end="url(#m)"/>
  <path class="ar" d="M260,350 L260,370" marker-end="url(#m)"/>
  <path class="ar" d="M640,350 L640,370" marker-end="url(#m)"/>

  <path class="ar" d="M260,430 L220,450" marker-end="url(#m)"/>
  <path class="ar" d="M640,430 L450,450" marker-end="url(#m)"/>
  <path class="ar" d="M450,270 L680,450" marker-end="url(#m)" stroke-dasharray="6 4" stroke="#1f8a40"/>
  <text x="730" y="380" font-size="11" fill="#1f8a40">Services →</text>
  <text x="730" y="395" font-size="11" fill="#1f8a40">CLI запуск Python</text>

  <rect x="100" y="525" width="700" height="22" fill="#f6f9fb" stroke="#bcd"/>
  <text x="450" y="541" text-anchor="middle" font-style="italic">Зависимости направлены сверху вниз: верхние слои используют нижние, обратное запрещено.</text>
</svg>
