<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Arial, sans-serif" font-size="12">
  <style>
    .ttl { font-weight:bold; font-size:17px; }
    .actor { fill:#fff; stroke:#2c5d8c; stroke-width:1.5; }
    .py { fill:#dff1d5; stroke:#1f8a40; stroke-width:1.5; }
    .db { fill:#fff5d1; stroke:#b08900; stroke-width:1.5; }
    .life { stroke:#2c5d8c; stroke-width:1; stroke-dasharray:4 3; }
    .act { fill:#e7f3ff; stroke:#2c5d8c; stroke-width:1.2; }
    .actpy { fill:#dff1d5; stroke:#1f8a40; stroke-width:1.2; }
    .ar { stroke:#333; stroke-width:1.4; fill:none; }
    .arr { stroke:#1f8a40; stroke-width:1.4; fill:none; stroke-dasharray:5 3; }
    .arrb { stroke:#444; stroke-width:1.3; fill:none; stroke-dasharray:5 3; }
    .lbl { fill:#111; }
    .sm { font-size:11px; fill:#444; }
    .tiny { font-size:10px; fill:#666; }
    .alt { fill:#fff7e0; stroke:#b08900; stroke-width:1; }
    .alterr { fill:#fbe9e9; stroke:#c0392b; stroke-width:1; }
    .name { font-weight:bold; }
    .note { fill:#fff; stroke:#888; stroke-width:1; }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
    <marker id="mg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f8a40"/></marker>
    <marker id="mb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#444"/></marker>
  </defs>

  <text x="650" y="22" text-anchor="middle" class="ttl">Sequence: гибридная рекомендация GET /v1/users/:id/recommendations/products?limit=K</text>

  <g>
    <rect class="actor" x="40" y="50" width="120" height="44"/>
    <text class="name lbl" x="100" y="78" text-anchor="middle">Vue 3 SPA</text>
    <line class="life" x1="100" y1="94" x2="100" y2="720"/>
  </g>
  <g>
    <rect class="actor" x="200" y="50" width="160" height="44"/>
    <text class="name lbl" x="280" y="72" text-anchor="middle">Go: Handler</text>
    <text class="tiny" x="280" y="86" text-anchor="middle">recommendation.go</text>
    <line class="life" x1="280" y1="94" x2="280" y2="720"/>
  </g>
  <g>
    <rect class="actor" x="400" y="50" width="160" height="44"/>
    <text class="name lbl" x="480" y="72" text-anchor="middle">authMiddleware</text>
    <text class="tiny" x="480" y="86" text-anchor="middle">JWT-валидация</text>
    <line class="life" x1="480" y1="94" x2="480" y2="720"/>
  </g>
  <g>
    <rect class="actor" x="600" y="50" width="200" height="44"/>
    <text class="name lbl" x="700" y="72" text-anchor="middle">Service: RecommendProducts</text>
    <text class="tiny" x="700" y="86" text-anchor="middle">recommendation_service.go</text>
    <line class="life" x1="700" y1="94" x2="700" y2="720"/>
  </g>
  <g>
    <rect class="py" x="830" y="50" width="200" height="44"/>
    <text class="name lbl" x="930" y="72" text-anchor="middle">Python: food_recommender</text>
    <text class="tiny" x="930" y="86" text-anchor="middle">scikit-learn · TruncatedSVD</text>
    <line class="life" x1="930" y1="94" x2="930" y2="720"/>
  </g>
  <g>
    <rect class="db" x="1070" y="50" width="180" height="44"/>
    <text class="name lbl" x="1160" y="72" text-anchor="middle">PostgreSQL</text>
    <text class="tiny" x="1160" y="86" text-anchor="middle">orders · order_items</text>
    <line class="life" x1="1160" y1="94" x2="1160" y2="720"/>
  </g>

  <rect class="act" x="95" y="110" width="10" height="600"/>
  <rect class="act" x="275" y="125" width="10" height="580"/>
  <rect class="act" x="475" y="135" width="10" height="70"/>
  <rect class="act" x="695" y="220" width="10" height="450"/>
  <rect class="actpy" x="925" y="290" width="10" height="240"/>

  <path class="ar" d="M105,125 L275,125" marker-end="url(#m)"/>
  <text class="sm" x="120" y="118">GET /recommendations/products?limit=K</text>
  <text class="tiny" x="120" y="132">Authorization: Bearer JWT, X-User-Id</text>

  <path class="ar" d="M285,150 L475,150" marker-end="url(#m)"/>
  <text class="sm" x="295" y="143">проверить токен</text>

  <rect x="490" y="160" width="220" height="40" fill="#fff" stroke="#888" stroke-width="1"/>
  <text class="tiny" x="600" y="178" text-anchor="middle" font-style="italic">decode JWT → user_id, role, exp</text>
  <text class="tiny" x="600" y="192" text-anchor="middle" font-style="italic">сохранить в Gin-context</text>

  <path class="arr" stroke="#444" stroke-dasharray="5 3" d="M475,210 L285,210" marker-end="url(#mb)"/>
  <text class="tiny" x="295" y="204" fill="#444">OK · c.Next()</text>

  <path class="ar" d="M285,240 L695,240" marker-end="url(#m)"/>
  <text class="sm" x="295" y="233">RecommendProducts(uid, K)</text>

  <rect class="alt" x="585" y="265" width="610" height="290"/>
  <text class="sm" x="595" y="282" font-style="italic">alt — основной путь: запуск Python-скрипта</text>

  <path class="arr" stroke="#1f8a40" stroke-dasharray="0" d="M705,310 L925,310" marker-end="url(#mg)"/>
  <text class="tiny" x="715" y="304" fill="#1f8a40">exec.Command(python, food_recommender.py,</text>
  <text class="tiny" x="715" y="316" fill="#1f8a40">--user-id, --k, --db-url)</text>

  <path class="ar" d="M935,345 L1155,345" marker-end="url(#m)"/>
  <text class="tiny" x="945" y="339">SELECT * FROM orders, order_items, favourites</text>
  <path class="arr" d="M1155,370 L935,370" marker-end="url(#mg)"/>
  <text class="tiny" x="945" y="364" fill="#1f8a40">DataFrame</text>

  <rect x="800" y="385" width="260" height="50" fill="#fff7e0" stroke="#b08900"/>
  <text class="tiny" x="930" y="403" text-anchor="middle" font-style="italic">TruncatedSVD (n_components = 24)</text>
  <text class="tiny" x="930" y="418" text-anchor="middle" font-style="italic">final = w_cb·CB + w_cf·CF + w_meal·meal +</text>
  <text class="tiny" x="930" y="430" text-anchor="middle" font-style="italic">          w_recency·recency</text>

  <path class="arr" stroke="#1f8a40" stroke-dasharray="0" d="M925,460 L705,460" marker-end="url(#mg)"/>
  <text class="tiny" x="715" y="454" fill="#1f8a40">stdout: JSON {recommendations: [...]}</text>

  <rect x="585" y="475" width="230" height="50" fill="#fff" stroke="#888" stroke-width="1"/>
  <text class="tiny" x="700" y="493" text-anchor="middle" font-style="italic">json.Unmarshal → []ProductRecommendation</text>
  <text class="tiny" x="700" y="508" text-anchor="middle" font-style="italic">sort by FinalScore desc · limit K</text>

  <rect class="alterr" x="585" y="565" width="610" height="100"/>
  <text class="sm" x="595" y="582" font-style="italic">alt — fallback: Python недоступен или вернул пустой ответ</text>

  <path class="ar" d="M705,610 L1155,610" marker-end="url(#m)"/>
  <text class="tiny" x="715" y="604">SELECT favourite_products + кандидаты по category_id/manufacturer_id</text>
  <path class="arr" d="M1155,635 L705,635" marker-end="url(#mg)"/>
  <text class="tiny" x="715" y="629" fill="#1f8a40">CB-эвристика по совпадению категорий</text>

  <path class="arr" stroke="#1f8a40" stroke-dasharray="0" d="M695,690 L285,690" marker-end="url(#mg)"/>
  <text class="tiny" x="305" y="684" fill="#1f8a40">[]ProductRecommendation</text>

  <path class="arr" stroke="#1f8a40" stroke-dasharray="0" d="M275,715 L105,715" marker-end="url(#mg)"/>
  <text class="tiny" x="125" y="709" fill="#1f8a40">200 OK + JSON</text>

  <rect x="40" y="730" width="1220" height="22" fill="#f6f9fb" stroke="#bcd" rx="3"/>
  <text x="50" y="746" font-size="11" font-style="italic">Целевая задержка цикла: ≤ 500 мс (с Python) / ≤ 200 мс (fallback). Сплошные стрелки — синхронные вызовы; пунктирные — ответы.</text>
</svg>
