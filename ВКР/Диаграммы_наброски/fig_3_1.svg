<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-weight:bold; font-size:16px; }
    .root { fill:#dde9f6; stroke:#2c5d8c; stroke-width:1.6; rx:8; ry:8; }
    .view { fill:#fff; stroke:#2c5d8c; stroke-width:1.4; rx:6; ry:6; }
    .api { fill:#fff5d1; stroke:#b08900; stroke-width:1.4; rx:6; ry:6; }
    .ev  { fill:#eaf5e6; stroke:#1f8a40; stroke-width:1.4; rx:18; ry:18; }
    .ar  { stroke:#333; stroke-width:1.3; fill:none; }
    .ev_ar { stroke:#1f8a40; stroke-width:1.4; fill:none; stroke-dasharray:6 4; }
    .name { font-weight:bold; }
    .sm { font-size:11px; fill:#555; }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="mg" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f8a40"/>
    </marker>
  </defs>

  <text x="500" y="22" text-anchor="middle" class="ttl">Vue 3 SPA: схема компонентов и канал событий cart-changed</text>

  <rect class="root" x="380" y="50" width="240" height="60"/>
  <text class="name" x="500" y="78" text-anchor="middle">App.vue + Router</text>
  <text class="sm" x="500" y="98" text-anchor="middle">vue-router, src/router/index.ts</text>

  <rect class="view" x="40"  y="160" width="170" height="60"/>
  <text class="name" x="125" y="190" text-anchor="middle">LoginView</text>
  <text class="sm" x="125" y="208" text-anchor="middle">/, /register</text>

  <rect class="view" x="230" y="160" width="170" height="60"/>
  <text class="name" x="315" y="190" text-anchor="middle">ProductsView</text>
  <text class="sm" x="315" y="208" text-anchor="middle">/products</text>

  <rect class="view" x="420" y="160" width="170" height="60"/>
  <text class="name" x="505" y="190" text-anchor="middle">OrdersView</text>
  <text class="sm" x="505" y="208" text-anchor="middle">/orders (корзина)</text>

  <rect class="view" x="610" y="160" width="170" height="60"/>
  <text class="name" x="695" y="190" text-anchor="middle">RecommendationsView</text>
  <text class="sm" x="695" y="208" text-anchor="middle">/recommendations</text>

  <rect class="view" x="800" y="160" width="170" height="60"/>
  <text class="name" x="885" y="190" text-anchor="middle">FavouritesView</text>
  <text class="sm" x="885" y="208" text-anchor="middle">/favourites</text>

  <rect class="view" x="40"  y="240" width="170" height="60"/>
  <text class="name" x="125" y="270" text-anchor="middle">CategoriesView</text>
  <rect class="view" x="230" y="240" width="170" height="60"/>
  <text class="name" x="315" y="270" text-anchor="middle">ManufacturersView</text>
  <rect class="view" x="420" y="240" width="170" height="60"/>
  <text class="name" x="505" y="270" text-anchor="middle">DishesView</text>
  <rect class="view" x="610" y="240" width="170" height="60"/>
  <text class="name" x="695" y="270" text-anchor="middle">UsersView</text>

  <path class="ar" d="M500,110 L125,160" marker-end="url(#m)"/>
  <path class="ar" d="M500,110 L315,160" marker-end="url(#m)"/>
  <path class="ar" d="M500,110 L505,160" marker-end="url(#m)"/>
  <path class="ar" d="M500,110 L695,160" marker-end="url(#m)"/>
  <path class="ar" d="M500,110 L885,160" marker-end="url(#m)"/>
  <path class="ar" d="M500,110 L125,240" marker-end="url(#m)"/>
  <path class="ar" d="M500,110 L315,240" marker-end="url(#m)"/>
  <path class="ar" d="M500,110 L505,240" marker-end="url(#m)"/>
  <path class="ar" d="M500,110 L695,240" marker-end="url(#m)"/>

  <rect class="api" x="280" y="360" width="440" height="60"/>
  <text class="name" x="500" y="385" text-anchor="middle">src/api/http.ts</text>
  <text class="sm" x="500" y="403" text-anchor="middle">axios + интерцептор: X-User-Id, Authorization: Bearer JWT</text>

  <rect class="ev" x="280" y="450" width="440" height="60"/>
  <text class="name" x="500" y="475" text-anchor="middle">localStorage + window event «cart-changed»</text>
  <text class="sm" x="500" y="495" text-anchor="middle">cartItems, currentUserId, authToken, currentUserGender</text>

  <path class="ar" d="M315,300 L400,360" marker-end="url(#m)"/>
  <path class="ar" d="M505,300 L500,360" marker-end="url(#m)"/>
  <path class="ar" d="M695,300 L600,360" marker-end="url(#m)"/>
  <path class="ar" d="M885,220 L720,360" marker-end="url(#m)"/>

  <path class="ev_ar" d="M505,220 L500,450" marker-end="url(#mg)"/>
  <path class="ev_ar" d="M315,300 Q200,440 280,470" marker-end="url(#mg)"/>
  <path class="ev_ar" d="M695,220 Q800,440 720,470" marker-end="url(#mg)"/>
  <text x="60" y="445" class="sm" fill="#1f8a40">Зелёные стрелки — публикация и подписка на событие cart-changed</text>
</svg>
