<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-weight:bold; font-size:16px; }
    .layer { fill:#fff; stroke:#7a99b1; stroke-width:1.5; rx:6; ry:6; }
    .comp  { fill:#e7f3ff; stroke:#2c5d8c; stroke-width:1.5; rx:6; ry:6; }
    .db    { fill:#fff5d1; stroke:#b08900; stroke-width:1.5; }
    .py    { fill:#dff1d5; stroke:#1f8a40; stroke-width:1.5; rx:6; ry:6; }
    .ar    { stroke:#333; stroke-width:1.5; fill:none; }
    .pyar  { stroke:#1f8a40; stroke-width:1.5; stroke-dasharray:6 4; fill:none; }
    .lbl   { fill:#111; }
    .h     { font-weight:bold; }
    .sm    { font-size:11px; fill:#555; }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
    <marker id="mg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1f8a40"/>
    </marker>
  </defs>

  <text x="500" y="28" text-anchor="middle" class="ttl">Общая архитектурная схема информационной системы</text>

  <rect class="layer" x="40" y="60" width="920" height="100"/>
  <text class="h" x="60" y="85">Клиентская часть (Vue 3 SPA, Vite, TypeScript)</text>
  <rect class="comp" x="80" y="100" width="160" height="50"/><text class="lbl" x="160" y="130" text-anchor="middle">ProductsView</text>
  <rect class="comp" x="260" y="100" width="160" height="50"/><text class="lbl" x="340" y="130" text-anchor="middle">OrdersView</text>
  <rect class="comp" x="440" y="100" width="190" height="50"/><text class="lbl" x="535" y="130" text-anchor="middle">RecommendationsView</text>
  <rect class="comp" x="650" y="100" width="160" height="50"/><text class="lbl" x="730" y="130" text-anchor="middle">FavouritesView</text>
  <rect class="comp" x="830" y="100" width="120" height="50"/><text class="lbl" x="890" y="130" text-anchor="middle">+ ещё 6</text>

  <rect class="layer" x="40" y="190" width="920" height="170"/>
  <text class="h" x="60" y="215">Серверная часть (Go 1.25, Gin, GORM, multi-layer)</text>
  <rect class="comp" x="80" y="230" width="180" height="40"/><text class="lbl" x="170" y="255" text-anchor="middle">API (api/v1/apies.go)</text>
  <rect class="comp" x="280" y="230" width="180" height="40"/><text class="lbl" x="370" y="255" text-anchor="middle">Handlers</text>
  <rect class="comp" x="480" y="230" width="180" height="40"/><text class="lbl" x="570" y="255" text-anchor="middle">Services</text>
  <rect class="comp" x="680" y="230" width="180" height="40"/><text class="lbl" x="770" y="255" text-anchor="middle">Repository</text>
  <rect class="comp" x="80"  y="290" width="180" height="40"/><text class="lbl" x="170" y="315" text-anchor="middle">Models (GORM)</text>
  <rect class="comp" x="280" y="290" width="180" height="40"/><text class="lbl" x="370" y="315" text-anchor="middle">Database</text>
  <rect class="comp" x="480" y="290" width="180" height="40"/><text class="lbl" x="570" y="315" text-anchor="middle">JWT / bcrypt / logrus</text>
  <rect class="comp" x="680" y="290" width="180" height="40"/><text class="lbl" x="770" y="315" text-anchor="middle">CORS middleware</text>

  <rect class="layer" x="40" y="390" width="920" height="110"/>
  <text class="h" x="60" y="415">Слой хранения и аналитики</text>
  <ellipse class="db" cx="180" cy="455" rx="120" ry="28"/>
  <text class="lbl" x="180" y="450" text-anchor="middle" font-weight="bold">PostgreSQL</text>
  <text class="lbl sm" x="180" y="468" text-anchor="middle">12 сущностей GORM</text>

  <ellipse class="db" cx="430" cy="455" rx="110" ry="28"/>
  <text class="lbl" x="430" y="450" text-anchor="middle" font-weight="bold">MongoDB</text>
  <text class="lbl sm" x="430" y="468" text-anchor="middle">products (изобр.)</text>

  <rect class="py" x="640" y="425" width="280" height="60"/>
  <text class="lbl" x="780" y="450" text-anchor="middle" font-weight="bold">Python ML (CLI)</text>
  <text class="lbl sm" x="780" y="468" text-anchor="middle">recommender.py / food_recommender.py / dish_recommender.py</text>

  <path class="ar" d="M500,160 L500,190" marker-end="url(#m)"/>
  <text class="sm" x="510" y="180">HTTPS, JSON, JWT</text>

  <path class="ar" d="M180,330 L180,427" marker-end="url(#m)"/>
  <text class="sm" x="190" y="378">GORM</text>

  <path class="ar" d="M770,330 L430,427" marker-end="url(#m)"/>
  <text class="sm" x="600" y="370">mongo-go-driver</text>

  <path class="pyar" d="M570,330 L780,425" marker-end="url(#mg)"/>
  <text class="sm" x="700" y="380" fill="#1f8a40">exec.Command, JSON stdout</text>
</svg>
