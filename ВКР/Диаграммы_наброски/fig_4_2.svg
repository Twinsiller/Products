<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-weight:bold; font-size:16px; }
    .ax { stroke:#333; stroke-width:1.2; fill:none; }
    .grid { stroke:#ddd; stroke-width:0.6; }
    .barB { fill:#c0392b; opacity:0.85; }
    .barG { fill:#1f8a40; opacity:0.9; }
    .target { stroke:#b08900; stroke-width:1.6; stroke-dasharray:5 4; fill:none; }
    .lbl { fill:#111; }
    .name { font-weight:bold; }
  </style>

  <text x="450" y="22" text-anchor="middle" class="ttl">Распределение долей макронутриентов в корзине: до и после применения гибридной модели</text>

  <text x="450" y="50" text-anchor="middle" font-style="italic" font-size="12" fill="#666">Серый — целевые доли (25/30/45 %), красный — без рекомендаций, зелёный — с гибридом (плейсхолдер)</text>

  <g transform="translate(80,80)">
    <line class="ax" x1="0" y1="320" x2="760" y2="320"/>
    <line class="ax" x1="0" y1="0"   x2="0"   y2="320"/>

    <g class="grid">
      <line x1="0" y1="64"  x2="760" y2="64"/>
      <line x1="0" y1="128" x2="760" y2="128"/>
      <line x1="0" y1="192" x2="760" y2="192"/>
      <line x1="0" y1="256" x2="760" y2="256"/>
    </g>

    <text x="-10" y="324" text-anchor="end" font-size="11">0%</text>
    <text x="-10" y="260" text-anchor="end" font-size="11">10%</text>
    <text x="-10" y="196" text-anchor="end" font-size="11">20%</text>
    <text x="-10" y="132" text-anchor="end" font-size="11">30%</text>
    <text x="-10" y="68"  text-anchor="end" font-size="11">40%</text>
    <text x="-10" y="4"   text-anchor="end" font-size="11">50%</text>

    <g>
      <text x="120" y="345" text-anchor="middle" font-weight="bold">Белки (целевая 25%)</text>
      <line class="target" x1="40" y1="160" x2="200" y2="160"/>
      <rect class="barB" x="60"  y="220" width="40" height="100"/>
      <text x="80"  y="215" text-anchor="middle" font-size="11">15,6%</text>
      <rect class="barG" x="140" y="158" width="40" height="162"/>
      <text x="160" y="153" text-anchor="middle" font-size="11">25,3%</text>
    </g>

    <g>
      <text x="380" y="345" text-anchor="middle" font-weight="bold">Жиры (целевая 30%)</text>
      <line class="target" x1="300" y1="128" x2="460" y2="128"/>
      <rect class="barB" x="320" y="60"  width="40" height="260"/>
      <text x="340" y="55"  text-anchor="middle" font-size="11">40,7%</text>
      <rect class="barG" x="400" y="124" width="40" height="196"/>
      <text x="420" y="119" text-anchor="middle" font-size="11">30,6%</text>
    </g>

    <g>
      <text x="640" y="345" text-anchor="middle" font-weight="bold">Углеводы (целевая 45%)</text>
      <line class="target" x1="560" y1="32" x2="720" y2="32"/>
      <rect class="barB" x="580" y="40"  width="40" height="280"/>
      <text x="600" y="35"  text-anchor="middle" font-size="11">43,7%</text>
      <rect class="barG" x="660" y="38"  width="40" height="282"/>
      <text x="680" y="33"  text-anchor="middle" font-size="11">44,1%</text>
    </g>
  </g>

  <g transform="translate(180,440)">
    <rect width="20" height="14" fill="#c0392b" opacity="0.85"/><text x="30" y="12">До (без рекомендаций)</text>
    <rect x="220" width="20" height="14" fill="#1f8a40" opacity="0.9"/><text x="250" y="12">После (с гибридом)</text>
    <line x1="430" y1="7" x2="460" y2="7" stroke="#b08900" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="470" y="12">Целевые доли</text>
  </g>
</svg>
